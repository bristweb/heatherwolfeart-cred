# Attaches cred.heatherwolfeart.com to the heatherwolfeart-cred Pages project.
# Wrangler 4 has no `pages domain` command; this calls the Pages domains API
# (POST /accounts/{account_id}/pages/projects/{project}/domains). When the zone
# is on the same account, that call is what creates the proxied DNS record and
# certificate. A hand-made CNAME to *.pages.dev returns Cloudflare 522.
name: Ensure Pages custom domain
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/pages-domain.yml
permissions: {}
jobs:
  domain:
    # Fork PRs cannot read CLOUDFLARE_API_TOKEN. Same-repo PRs can.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Attach cred.heatherwolfeart.com
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - << 'PY'
          import json, os, subprocess, sys, time, urllib.error, urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID") or ""
          if not token or not account:
              sys.exit("CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required")

          project = "heatherwolfeart-cred"
          host = "cred.heatherwolfeart.com"
          base = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/pages/projects/"
              + project
              + "/domains"
          )

          def req(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode("utf-8", "replace")
                  try:
                      payload = json.loads(raw)
                  except json.JSONDecodeError:
                      payload = {"success": False, "errors": [{"message": raw[:500]}]}
                  return error.code, payload

          def summarize(payload):
              result = payload.get("result") or {}
              validation = result.get("validation_data") or {}
              verification = result.get("verification_data") or {}
              errors = payload.get("errors") or []
              print(json.dumps({
                  "http_success": payload.get("success"),
                  "name": result.get("name"),
                  "status": result.get("status"),
                  "zone_tag": result.get("zone_tag"),
                  "validation_status": validation.get("status"),
                  "validation_method": validation.get("method"),
                  "validation_error": validation.get("error_message"),
                  "verification_status": verification.get("status"),
                  "verification_error": verification.get("error_message"),
                  "api_errors": [
                      {"code": item.get("code"), "message": item.get("message")}
                      for item in errors
                  ],
              }, indent=2))

          def error_text(payload):
              return " ".join(
                  (item.get("message") or "") for item in (payload.get("errors") or [])
              ).lower()

          status, payload = req("GET", base + "/" + host)
          print("GET", status)
          summarize(payload)
          present = status == 200 and payload.get("success") and (payload.get("result") or {}).get("name")
          if not present:
              message = error_text(payload)
              if status not in (404, 400) and "not found" not in message and "could not find" not in message:
                  # A 403 here means the token cannot read Pages domains. Still try to add.
                  if status not in (403,):
                      print("domain lookup failed")
              print("POST", host)
              status, payload = req("POST", base, {"name": host})
              print("POST", status)
              summarize(payload)
              message = error_text(payload)
              if "another project" in message or "different project" in message:
                  sys.exit("domain is attached to a different project; leaving it alone")
              if not payload.get("success"):
                  if "already" in message or "exists" in message:
                      status, payload = req("GET", base + "/" + host)
                      print("GET after already-exists", status)
                      summarize(payload)
                  else:
                      sys.exit("failed to add custom domain")

          retried = False
          for attempt in range(1, 41):
              # curl -I does not follow redirects; 200 has to come from this hostname.
              probe = subprocess.run(
                  [
                      "curl", "-sS", "-o", "/dev/null", "-w", "%{http_code}",
                      "-I", "--max-time", "20", "https://" + host + "/",
                  ],
                  capture_output=True, text=True,
              )
              code = (probe.stdout or "").strip() or "curl-failed"
              if probe.returncode != 0:
                  code = "curl-" + str(probe.returncode)
              print("https attempt", attempt, code)
              if code == "200":
                  sys.exit(0)
              status, payload = req("GET", base + "/" + host)
              result = payload.get("result") or {}
              domain_status = result.get("status")
              validation = result.get("validation_data") or {}
              print("domain status", domain_status, "validation", validation.get("status"), validation.get("error_message"))
              if domain_status in ("error", "deactivated", "blocked") and not retried:
                  retried = True
                  print("PATCH retry validation")
                  patch_status, patch_payload = req("PATCH", base + "/" + host)
                  print("PATCH", patch_status)
                  summarize(patch_payload)
              time.sleep(15)
          sys.exit("https://" + host + "/ did not return 200")
          PY
      - name: Confirm the custom domain serves the Pages project
        run: |
          set -euo pipefail
          headers=$(curl -sSI --max-time 30 https://cred.heatherwolfeart.com/)
          printf '%s\n' "$headers" | head -n 20
          printf '%s\n' "$headers" | head -n 1 | grep -q '200'
          python3 - << 'PY'
          import hashlib, urllib.request
          paths = ["/", "/config.js", "/reviews/2026.json"]
          hosts = [
              "https://cred.heatherwolfeart.com",
              "https://heatherwolfeart-cred.pages.dev",
          ]
          for path in paths:
              digests = []
              for host in hosts:
                  with urllib.request.urlopen(host + path, timeout=60) as response:
                      body = response.read()
                      status = response.status
                  digest = hashlib.sha256(body).hexdigest()
                  digests.append((status, digest, len(body)))
                  print(host + path, status, digest, len(body))
              if digests[0] != digests[1]:
                  raise SystemExit("content mismatch for " + path)
          print("custom domain matches pages.dev")
          PY
